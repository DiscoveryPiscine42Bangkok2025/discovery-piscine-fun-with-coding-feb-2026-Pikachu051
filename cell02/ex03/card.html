<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <h1 class="main-title">User Profile Card</h1>

    <div class="card-container">
        <img src="chin.jpg" alt="Profile" class="profile-pic">

        <table class="info-table">
            <tr>
                <td class="login-text">Chin</td>
            </tr>
            <tr>
                <td class="description">Age 22</td>
            </tr>
            <tr>
                <td class="social-icons">
                    <a href="https://instagram.com/chinfair_" target="_blank">
                        <img src="https://cdn-icons-png.flaticon.com/512/87/87390.png" alt="Instagram">
                    </a>
                </td>
            </tr>
        </table>

        <a href="https://instagram.com/chinfair_" class="contact-btn">Contact</a>
    </div>

</body>
</html>
