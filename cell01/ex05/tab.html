<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Tab</title>
    </head>
    <body>
        <table style="width: 100%; border-collapse: collapse; height: 150px;">
            <tr>
                <td style="background-color: #8dc9af; width: 50%; padding: 20px;">
                    This is not green.
                </td>

                <td style="background-color: #ffbce2; width: 50%; padding: 20px;">
                    Joking! It was green.
                </td>
            </tr>
        </table>
    </body>
</html>
