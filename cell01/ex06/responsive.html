<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Table</title>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            table {
                width: 100%;
                height: 100%;
                border-collapse: collapse;
                table-layout: fixed;
            }
            td {
                width: 50%;
                padding: 20px;
                text-align: center;
                font-family: sans-serif;
            }
            .left-cell {
                background-color: #8dc9af;
            }
            .right-cell {
                background-color: #ffbce2;
            }

            @media (max-width: 600px) {
                td {
                    display: block;
                    width: 100%;
                    height: 50%;
                }
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td class="left-cell">
                    This is not green.
                </td>
                <td class="right-cell">
                    Joking! It was green.
                </td>
            </tr>
        </table>
    </body>
</html>
