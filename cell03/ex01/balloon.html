<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #balloon {
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 50%;
            cursor: pointer;
            transition: width 0.1s, height 0.1s, background-color 0.1s;
        }
    </style>
</head>
<body>

    <div id="balloon"></div>

    <script>
        const balloon = document.getElementById('balloon');

        let currentSize = 200;
        let colorIndex = 0; 
        const colors = ['red', 'green', 'blue'];

        function renderBalloon() {
            balloon.style.width = currentSize + 'px';
            balloon.style.height = currentSize + 'px';
            balloon.style.backgroundColor = colors[colorIndex];
        }

        balloon.addEventListener('click', () => {
            currentSize += 10;
            
            colorIndex++;
            if (colorIndex > 2) {
                colorIndex = 0;
            }

            if (currentSize > 420) {
                currentSize = 200;
                colorIndex = 0;
            }

            renderBalloon();
        });
        balloon.addEventListener('mouseleave', () => {
            if (currentSize > 200) {
                currentSize -= 5;
            }

            colorIndex--;
            if (colorIndex < 0) {
                colorIndex = 2;
            }

            renderBalloon();
        });
    </script>
</body>
</html>
