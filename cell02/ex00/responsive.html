<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Table</title>
        <link rel="stylesheet" href="responsive.css" type="text/css">
    </head>
    <body>
        <table>
            <tr>
                <td class="left-cell">
                    This is not green.
                </td>
                <td class="right-cell">
                    Joking! It was green.
                </td>
            </tr>
        </table>
    </body>
</html>
